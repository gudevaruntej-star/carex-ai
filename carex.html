<script>
const t={appName:'CareX',subtitle:'మీ ఆరోగ్యానికి డిజిటల్ సహాయం',scanReportBtn:'వైద్య నివేదికను స్కాన్ చేయండి',askQuestionBtn:'ఆరోగ్య ప్రశ్న అడగండి',home:'ప్రధాన పేజీ',back:'వెనక్కి',startScan:'AIతో నివేదికను విశ్లేషించండి',processing:'AI పరిశీలిస్తోంది...',medicinesFound:'నివేదిక విశ్లేషణ',askAgain:'మళ్లీ అడగండి',goHome:'ప్రధాన పేజీకి వెళ్లండి',retry:'మళ్లీ ప్రయత్నించండి',submit:'AI సమాధానం చూడండి',askQuestionPrompt:'మీ ఆరోగ్య ప్రశ్నను అడగండి',privacyNote:'మీ వ్యక్తిగత ఆరోగ్య సమాచారం గోప్యంగా ఉంచబడుతుంది.',reportDisclaimer:'ఈ సమాచారం మీరు పంపిన నివేదికలో కనిపించిన వివరాల ఆధారంగా AI ద్వారా చూపబడుతోంది.',dispenseWarning:'మందుల పంపిణీ వైద్యుని సూచన / ధృవీకరించిన ప్రిస్క్రిప్షన్ ఆధారంగా మాత్రమే జరుగుతుంది.',noInfo:'AIకి ఉపయోగకరమైన సమాచారం దొరకలేదు.',consultDoctor:'దయచేసి వైద్య నిపుణుడిని సంప్రదించండి.',multipleDiseases:'ఈ ప్రశ్నకు ఒకటి కంటే ఎక్కువ అంశాలు సంబంధించి ఉండవచ్చు.',selectDisease:'AI మీ ప్రశ్నను విశ్లేషిస్తోంది.',emergencyTitle:'ఇది అత్యవసర పరిస్థితి కావచ్చు.',emergencyDesc1:'తక్షణ వైద్య సహాయం పొందండి.',emergencyDesc2:'సమీపంలోని ఆసుపత్రి లేదా అత్యవసర సేవలను సంప్రదించండి.',unclearReport:'నివేదికను AI చదవలేకపోయింది. దయచేసి స్పష్టమైన PDF లేదా చిత్రం మళ్లీ పంపండి.',patientName:'రోగి పేరు',diagnosis:'వ్యాధి / నిర్ధారణ',dosage:'మోతాదు',frequency:'రోజుకు',duration:'కాలవ్యవధి',adminLogin:'అడ్మిన్ లాగిన్',password:'పాస్‌వర్డ్',login:'లాగిన్'};

let view='HOME',question='',selectedFile=null,lastReport=null,qout=null,timer=null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const icon=x=>'<div class="icon">'+x+'</div>';
function btn(label,cls,fn,disabled){const b=document.createElement('button');b.className=cls;b.innerHTML=label;b.onclick=fn;b.disabled=!!disabled;return b}
function header(){const h=document.getElementById('headerActions');h.innerHTML='';if(view!=='HOME')h.append(btn('⌂ '+t.home,'nav-btn',home));else h.append(btn('⚙','icon-btn',adminLogin))}
function setView(v){view=v;header();render();window.scrollTo({top:0,behavior:'smooth'});clearTimeout(timer);if(v!=='HOME')timer=setTimeout(home,90000)}
function home(){question='';selectedFile=null;qout=null;setView('HOME')}
function render(){const root=document.getElementById('app');root.innerHTML='';const map={HOME:renderHome,SCAN:renderScan,PROC_SCAN:renderProcessing,PROC_Q:renderProcessing,SCAN_RESULT:renderScanResult,QUESTION:renderQuestion,QRESULT:renderQResult,EMERGENCY:renderEmergency,ERROR:renderError,ADMIN:renderAdmin};(map[view]||renderHome)(root)}
function renderHome(r){r.innerHTML='<section class="hero"><div class="hero-copy"><span class="eyebrow">AI • CARE • CLARITY • ACCESS</span><h1>మీ ఆరోగ్యానికి AI ఆధారిత డిజిటల్ సహాయం</h1><p>'+esc(t.privacyNote)+'</p></div><div class="home-cards"></div><div class="pill-row"><span>AI Powered</span><span>తెలుగు</span><span>PDF + Images</span><span>90s ఆటో రీసెట్</span></div></section>';const c=r.querySelector('.home-cards');const a=document.createElement('button');a.className='action-card secondary';a.innerHTML=icon('▣')+'<span>'+t.scanReportBtn+'</span><small>PDF లేదా report image పంపండి. AI reportలోని వివరాలను చదివి తెలుగులో వివరిస్తుంది.</small>';a.onclick=()=>setView('SCAN');const q=document.createElement('button');q.className='action-card primary';q.innerHTML=icon('✦')+'<span>'+t.askQuestionBtn+'</span><small>మీ ప్రశ్నను తెలుగు లేదా Englishలో అడగండి. అవసరమైతే ఈ session reportను కూడా AI contextగా ఉపయోగిస్తుంది.</small>';q.onclick=()=>setView('QUESTION');c.append(a,q)}
function renderScan(r){r.innerHTML='<section class="panel"><div class="backline" id="back">‹ '+t.back+'</div>'+icon('▣')+'<h2>'+t.scanReportBtn+'</h2><p>PDF లేదా medical report imageను ఎంచుకోండి</p><p class="muted">AI కనిపించే text, values, diagnosis మరియు prescription వివరాలను మాత్రమే విశ్లేషిస్తుంది.</p><label class="upload-box"><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><span style="font-size:34px">⌁</span><strong id="fname">రిపోర్ట్ ఫైల్‌ను ఎంచుకోండి</strong><span>PDF, JPG, PNG, WEBP • గరిష్టంగా 20MB</span></label><button id="scanBtn" class="wide primary-btn" disabled>'+t.startScan+'</button></section>';r.querySelector('#back').onclick=home;const f=r.querySelector('#file'),b=r.querySelector('#scanBtn');f.onchange=e=>{selectedFile=e.target.files?.[0]||null;r.querySelector('#fname').textContent=selectedFile?.name||'రిపోర్ట్ ఫైల్‌ను ఎంచుకోండి';b.disabled=!selectedFile};b.onclick=analyzeReport}
async function analyzeReport(){if(!selectedFile)return;setView('PROC_SCAN');try{const fd=new FormData();fd.append('report',selectedFile);const res=await fetch('/api/analyze-report',{method:'POST',body:fd});const data=await res.json();if(!res.ok)throw new Error(data.error||'AI report analysis failed');lastReport=data;if(data.urgency==='EMERGENCY')setView('EMERGENCY');else{qout=data;setView('SCAN_RESULT')}}catch(e){qout={message:e.message};setView('ERROR')}}
function renderProcessing(r){const isQ=view==='PROC_Q';r.innerHTML='<section class="processing"><div class="spinner"></div><h2>'+t.processing+'</h2><p>'+esc(isQ?'మీ ప్రశ్నకు AI సమాధానం సిద్ధం చేస్తోంది...':'మీ నివేదికలోని వివరాలు, test values మరియు prescriptionను పరిశీలిస్తోంది...')+'</p></section>'}
function renderScanResult(r){const d=lastReport||{};const meds=Array.isArray(d.medicines)?d.medicines:[];const findings=Array.isArray(d.findings)?d.findings:[];r.innerHTML='<section class="content result-content"><div class="title-row"><span class="eyebrow">AI REPORT ANALYSIS</span><h2>'+t.medicinesFound+'</h2></div><div class="patient-card"><div><span>'+t.patientName+'</span><strong>'+esc(d.patientName||'Not visible')+'</strong></div><div><span>'+t.diagnosis+'</span><strong>'+esc(d.diagnosis||'Not stated')+'</strong></div></div><div class="answer-card" style="margin-bottom:18px"><span class="answer-chip">AI సారాంశం</span><p class="answer" style="font-size:20px;min-height:auto">'+esc(d.summary_telugu||'')+'</p>'+(findings.length?'<div class="notice"><div class="notice-icon">✓</div><div><strong>ముఖ్యమైన findings</strong><ul class="finding-list">'+findings.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>':'')+'</div>'+(meds.length?'<div class="medicine-list">'+meds.map(m=>'<div class="medicine-card"><div><h3>'+esc(m.name)+'</h3><span class="tag">'+esc(m.strength)+'</span></div><div class="med-facts"><div><span>'+t.dosage+'</span><strong>'+esc(m.dosage)+'</strong></div><div><span>'+t.frequency+'</span><strong>'+esc(m.frequency)+'</strong></div><div><span>'+t.duration+'</span><strong>'+esc(m.duration)+'</strong></div></div></div>').join('')+'</div>':'<div class="empty" style="padding:30px 0"><p>ఈ నివేదికలో AIకి prescription medicines కనిపించలేదు.</p></div>')+'<div class="notice warning"><div class="notice-icon">⚠</div><div><strong>'+t.dispenseWarning+'</strong><p>'+esc(d.confidence_note_telugu||t.reportDisclaimer)+'</p></div></div><div class="footer-actions" id="fa"></div></section>';const f=r.querySelector('#fa');f.append(btn(t.retry,'outline-btn big',()=>setView('SCAN')),btn(t.goHome,'primary-btn big',home))}
function renderQuestion(r){r.innerHTML='<section class="panel"><div class="backline" id="back">‹ '+t.back+'</div><div class="qicon">✦</div><h2>'+t.askQuestionPrompt+'</h2><p class="muted">ఉదాహరణ: “నా glucose reportలో ఎక్కువగా ఉందా?” లేదా “Diabetes లక్షణాలు ఏమిటి?”</p><div class="textarea-wrap"><textarea id="q" placeholder="మీ ప్రశ్నను తెలుగులో లేదా Englishలో టైప్ చేయండి..."></textarea><button id="mic" class="mic-btn">🎙</button></div><button id="submit" class="wide primary-btn" disabled>'+t.submit+'</button></section>';const q=r.querySelector('#q'),s=r.querySelector('#submit');r.querySelector('#back').onclick=home;q.value=question;q.oninput=e=>{question=e.target.value;s.disabled=!question.trim()};q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};s.onclick=ask;r.querySelector('#mic').onclick=voice}
function voice(){try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('ఈ బ్రౌజర్‌లో voice input అందుబాటులో లేదు.');return}const rec=new SR();rec.lang='te-IN';rec.onresult=e=>{question=e.results[0][0].transcript;render();document.getElementById('q').focus()};rec.start()}catch{}}
async function ask(){if(!question.trim())return;setView('PROC_Q');try{const res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,reportContext:lastReport||null})});const data=await res.json();if(!res.ok)throw new Error(data.error||'AI answer failed');qout=data;if(data.urgency==='EMERGENCY')setView('EMERGENCY');else setView('QRESULT')}catch(e){qout={message:e.message};setView('ERROR')}}
function renderQResult(r){const o=qout||{};if(o.message){return renderError(r)}r.innerHTML='<section class="content result-content"><div class="answer-card"><span class="answer-chip">'+esc(o.related_topic||'AI HEALTH ANSWER')+'</span><p class="answer">'+esc(o.answer_telugu||'')+'</p><div class="notice"><div class="notice-icon">ⓘ</div><p>'+esc(o.caution_telugu||'CareX information is not a final medical diagnosis.')+'</p></div></div><div class="footer-actions" id="fa"></div></section>';const f=r.querySelector('#fa');f.append(btn(t.askAgain,'outline-btn big',()=>{question='';setView('QUESTION')}),btn(t.goHome,'primary-btn big',home))}
function renderEmergency(r){r.innerHTML='<section class="emergency">'+icon('⚠')+'<span class="eyebrow">AI EMERGENCY ALERT</span><h2>'+t.emergencyTitle+'</h2><p>'+t.emergencyDesc1+'</p><small>'+t.emergencyDesc2+'</small><button class="emergency-home" id="eh">'+t.goHome+'</button></section>';r.querySelector('#eh').onclick=home}
function renderError(r){const msg=qout?.message||t.unclearReport;r.innerHTML='<section class="content result-content"><div class="empty">'+icon('!')+'<h2>CareX AI</h2><p>'+esc(msg)+'</p></div><div class="footer-actions" id="fa"></div></section>';const f=r.querySelector('#fa');f.append(btn(t.retry,'outline-btn big',()=>setView('QUESTION')),btn(t.goHome,'primary-btn big',home))}
async function adminLogin(){setView('ADMIN')}
async function renderAdmin(r){if(!window._adminMode){r.innerHTML='<section class="admin-login"><div class="login-card"><div class="qicon">⚙</div><h2>'+t.adminLogin+'</h2><input id="pw" type="password" placeholder="'+t.password+'"><button id="login" class="wide primary-btn">'+t.login+'</button><button id="back" class="link-btn">'+t.back+'</button></div></section>';r.querySelector('#login').onclick=async()=>{if(r.querySelector('#pw').value==='admin123'){window._adminMode=true;render()}else alert('డెమో పాస్‌వర్డ్: admin123')};r.querySelector('#back').onclick=home;return}r.innerHTML='<section class="content"><div class="title-row"><span class="eyebrow">ADMIN • AI SYSTEM</span><h2>CareX AI Admin Dashboard</h2></div><div class="admin-grid"><div class="admin-card"><div class="admin-card-head"><h3>✦ AI Engine</h3></div><div class="list-row"><span>Provider</span><small id="provider">Checking...</small></div><div class="list-row"><span>Model</span><small id="model">Checking...</small></div><div class="list-row"><span>API status</span><small id="status">Checking...</small></div></div><div class="admin-card"><div class="admin-card-head"><h3>◫ Current Session</h3></div><div class="list-row"><span>Report loaded</span><small>'+(lastReport?'YES':'NO')+'</small></div><div class="list-row"><span>AI Q&A</span><small>ENABLED</small></div><div class="list-row"><span>Report types</span><small>PDF + IMAGE</small></div></div></div><div class="admin-card"><div class="admin-card-head"><h3>◈ Safety Status</h3></div><div class="status-grid"><span>Report analysis: <b>AI</b></span><span>Health Q&A: <b>AI</b></span><span>Urgency routing: <b>AI + safety rules</b></span><span>Medicine transcription: <b>AI / read-only</b></span></div></div></section>';fetch('/api/health').then(x=>x.json()).then(x=>{r.querySelector('#provider').textContent=x.provider;r.querySelector('#model').textContent=x.model;r.querySelector('#status').textContent=x.aiConfigured?'CONFIGURED':'ADD API KEY'}).catch(()=>r.querySelector('#status').textContent='SERVER OFFLINE')}
header();render();
</script></body></html>
